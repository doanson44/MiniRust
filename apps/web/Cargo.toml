[package]
name = "minirust-web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MiniRust Leptos SSR + hydration application"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
axum = { workspace = true, optional = true }
axum-extra = { workspace = true, optional = true }
leptos.workspace = true
leptos_axum = { workspace = true, optional = true }
leptos_router.workspace = true
serde.workspace = true
serde_json.workspace = true
minirust-config = { workspace = true, optional = true }
minirust-core.workspace = true
minirust-locales.workspace = true
minirust-database = { workspace = true, optional = true }
minirust-observability = { workspace = true, optional = true }
minirust-services = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
gloo-net.workspace = true
js-sys.workspace = true
web-sys.workspace = true
wasm-bindgen.workspace = true

[dev-dependencies]
tower.workspace = true

[features]
default = ["ssr"]
ssr = [
    "dep:axum",
    "dep:axum-extra",
    "dep:leptos_axum",
    "dep:minirust-config",
    "dep:minirust-database",
    "dep:minirust-observability",
    "dep:minirust-services",
    "dep:tokio",
    "dep:tower-http",
    "dep:tracing",
    "leptos/ssr",
    "leptos_axum/default",
    "leptos_router/ssr"
]
hydrate = ["leptos/hydrate"]

# uuid needs a WASM-compatible randomness source when building the hydrate bundle
[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { workspace = true, features = ["js"] }

[package.metadata.leptos]
output-name = "minirust-web"
site-root = "target/site"
site-pkg-dir = "pkg"
site-addr = "127.0.0.1:3001"
reload-port = 3002
env = "PROD"
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"
