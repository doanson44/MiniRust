services:
  mariadb-test:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: minirust_test
      MARIADB_USER: minirust_test
      MARIADB_PASSWORD: minirust_test
      MARIADB_ROOT_PASSWORD: minirust_test_root
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root -p$$MARIADB_ROOT_PASSWORD --silent"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  api-integration-tests:
    image: rust:1.90-bookworm
    working_dir: /workspace
    volumes:
      - .:/workspace
      - cargo_registry:/usr/local/cargo/registry
      - cargo_git:/usr/local/cargo/git
      - cargo_target:/workspace/target
    environment:
      MINIRUST_TEST_DATABASE_URL: mysql://minirust_test:minirust_test@mariadb-test:3306/minirust_test
      MINIRUST_AUTH_SECRET: test-only-secret-that-is-at-least-32-bytes-long
    depends_on:
      mariadb-test:
        condition: service_healthy
    command:
      - cargo
      - test
      - -p
      - minirust-api
      - --test
      - auth_endpoints
      - --
      - --test-threads=1

volumes:
  cargo_registry:
  cargo_git:
  cargo_target:
