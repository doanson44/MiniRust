[workspace]
members = [
    "apps/api",
    "apps/web",
    "crates/config",
    "crates/core",
    "crates/database",
    "crates/services",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
axum = "0.8"
axum-extra = { version = "0.12", default-features = false, features = ["cookie"] }
dotenvy = "0.15"
leptos = { version = "0.8", default-features = false, features = ["ssr"] }
leptos_axum = { version = "0.8", default-features = false }
leptos_router = { version = "0.8", default-features = false }
leptos_meta = { version = "0.8", default-features = false }
gloo-net = { version = "0.6", default-features = false, features = ["http", "json"] }
web-sys = { version = "0.3", default-features = false, features = ["Window", "Location"] }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1.26", default-features = false, features = ["std", "v7"] }
base64 = "0.23"
getrandom = "0.4"
hmac = "0.13"
sha2 = "0.11"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "mysql", "migrate"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

minirust-config = { path = "crates/config" }
minirust-core = { path = "crates/core" }
minirust-database = { path = "crates/database" }
minirust-services = { path = "crates/services" }
