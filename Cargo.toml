[workspace]
members = [
    "apps/api",
    "apps/web",
    "crates/config",
    "crates/core",
    "crates/database",
    "crates/observability",
    "crates/services",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[profile.dev]
# Avoid unbounded incremental artifacts during local build/test cycles.
incremental = false
debug = 1

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[workspace.dependencies]
axum = "0.8"
axum-extra = { version = "0.12", default-features = false, features = ["cookie"] }
dotenvy = "0.15"
leptos = { version = "0.8", default-features = false }
leptos_axum = { version = "0.8" }
leptos_router = { version = "0.8", default-features = false }
leptos_meta = { version = "0.8", default-features = false }
lettre = { version = "0.11.19", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls", "ring", "webpki-roots"] }
gloo-net = { version = "0.6", default-features = false, features = ["http", "json"] }
js-sys = "0.3"
web-sys = { version = "0.3", default-features = false, features = ["Window", "Location", "HtmlInputElement"] }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.26", default-features = false, features = ["std", "v7"] }
base64 = "0.23"
getrandom = "0.4"
hmac = "0.13"
sha2 = "0.11"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "mysql", "migrate"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
testcontainers = "0.28"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

minirust-config = { path = "crates/config" }
minirust-core = { path = "crates/core" }
minirust-database = { path = "crates/database" }
minirust-observability = { path = "crates/observability" }
minirust-services = { path = "crates/services" }
