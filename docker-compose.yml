# Optional local infrastructure. Not required to compile or run the baseline.
#
# Start:
#   docker compose --profile infra up -d
#
# Stop:
#   docker compose --profile infra down
#
# MariaDB is available at localhost:3306.
#
# The API and web applications do not connect to this service yet.

services:
  mariadb:
    image: mariadb:11
    profiles: ["infra"]
    ports:
      - "3306:3306"
    environment:
      MARIADB_DATABASE: minirust
      MARIADB_USER: minirust
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-}
