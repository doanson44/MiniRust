# Optional local infrastructure. Not required to compile or run the baseline.
#
# Start:
#   docker compose --profile infra up -d
#
# Stop:
#   docker compose --profile infra down
#
# SQL Server requires MSSQL_SA_PASSWORD in the environment or a local `.env`.
# Redis is available at redis://127.0.0.1:6379/
# SQL Server is available at localhost:1433
#
# The API and web applications do not connect to these services yet.

services:
  redis:
    image: redis:7-alpine
    profiles: ["infra"]
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    profiles: ["infra"]
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-}
