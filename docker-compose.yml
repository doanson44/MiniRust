services:
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-minirust}
      MARIADB_USER: ${MARIADB_USER:-minirust}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-minirust}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root -p$$MARIADB_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      MINIRUST_ENV: production
      MINIRUST_LOG_DIR: /var/log/minirust
      MINIRUST_API_HOST: 0.0.0.0
      MINIRUST_API_PORT: 3000
      MINIRUST_DB_HOST: mariadb
      MINIRUST_DB_PORT: "3306"
      MINIRUST_DB_NAME: ${MARIADB_DATABASE:-minirust}
      MINIRUST_DB_USER: ${MARIADB_USER:-minirust}
      MINIRUST_DB_PASSWORD: ${MARIADB_PASSWORD:-minirust}
      MINIRUST_AUTH_SECRET: ${MINIRUST_AUTH_SECRET:?MINIRUST_AUTH_SECRET must be set}
      MINIRUST_ADMIN_EMAIL: ${MINIRUST_ADMIN_EMAIL:?MINIRUST_ADMIN_EMAIL must be set}
      MINIRUST_ADMIN_OTP: ${MINIRUST_ADMIN_OTP:?MINIRUST_ADMIN_OTP must be set}
    ports:
      - "3000:3000"
    volumes:
      - minirust_logs:/var/log/minirust
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      MINIRUST_ENV: production
      MINIRUST_LOG_DIR: /var/log/minirust
      MINIRUST_WEB_HOST: 0.0.0.0
      MINIRUST_WEB_PORT: 3001
      MINIRUST_DB_HOST: mariadb
      MINIRUST_DB_PORT: "3306"
      MINIRUST_DB_NAME: ${MARIADB_DATABASE:-minirust}
      MINIRUST_DB_USER: ${MARIADB_USER:-minirust}
      MINIRUST_DB_PASSWORD: ${MARIADB_PASSWORD:-minirust}
      MINIRUST_AUTH_SECRET: ${MINIRUST_AUTH_SECRET:?MINIRUST_AUTH_SECRET must be set}
      MINIRUST_ADMIN_EMAIL: ${MINIRUST_ADMIN_EMAIL:?MINIRUST_ADMIN_EMAIL must be set}
      MINIRUST_ADMIN_OTP: ${MINIRUST_ADMIN_OTP:?MINIRUST_ADMIN_OTP must be set}
    ports:
      - "3001:3001"
    volumes:
      - minirust_logs:/var/log/minirust
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3001/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      MINIRUST_DOMAIN: ":80"
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy

volumes:
  mariadb_data:
  minirust_logs:
  caddy_data:
  caddy_config:
