name: Refresh Cargo.lock

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.head_commit.message != 'chore: refresh Cargo.lock'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.90
        uses: dtolnay/rust-toolchain@1.90.0

      - name: Regenerate Cargo.lock
        run: cargo generate-lockfile

      - name: Commit generated lockfile and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git rm .github/workflows/refresh-lock.yml
          if git diff --cached --quiet; then
            echo "Cargo.lock is already current."
            exit 0
          fi
          git commit -m "chore: refresh Cargo.lock"
          git push
